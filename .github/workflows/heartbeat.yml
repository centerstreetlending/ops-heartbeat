name: Heartbeat

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Run check
        env:
          TARGET_URL: ${{ secrets.TARGET_URL }}
          TARGET_TOKEN: ${{ secrets.TARGET_TOKEN }}
        run: |
          code=$(curl -sS -o /dev/null -w "%{http_code}" "$TARGET_URL" -H "Authorization: Bearer $TARGET_TOKEN")
          test "$code" = "200"
