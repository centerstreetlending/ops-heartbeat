name: Ops Heartbeat
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Trigger endpoint
        env:
          TARGET_URL: ${{ secrets.TARGET_URL }}
          TARGET_TOKEN: ${{ secrets.TARGET_TOKEN }}
        run: |
          STATUS=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 25 -H "Authorization: Bearer $TARGET_TOKEN" "$TARGET_URL")
          echo "Heartbeat HTTP status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "::error::Worker returned HTTP $STATUS"
            exit 1
          fi
